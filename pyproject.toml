[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmmrag"
version = "0.1.0"
description = "Baselines for fine-grained multimodal evidence acquisition"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = [
  "torch>=2.2",
  "transformers>=4.40",
  "pillow>=10.0",
]
official-clip = ["cn-clip>=1.6,<2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
